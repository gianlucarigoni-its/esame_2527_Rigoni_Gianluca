<div>
  <div
    class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom"
  >
    <h1 class="h3 mb-0 fw-bold">Le mie classi</h1>

    @if (isTeacher()) {
      <button
        type="button"
        class="btn btn-primary d-inline-flex align-items-center gap-2 shadow-sm"
        (click)="openCreateModal()"
      >
        <i class="bi bi-plus-lg" aria-hidden="true"></i>
        <span>Crea nuova classe</span>
      </button>
    }
  </div>
  <app-list-classroom
    [isTeacher]="isTeacher()"
    [classrooms]="classrooms()"
  ></app-list-classroom>
</div>
