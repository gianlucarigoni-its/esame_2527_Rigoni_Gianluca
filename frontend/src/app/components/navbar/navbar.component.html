<nav class="navbar navbar-expand-lg bg-body-secondary">
  <div class="container-fluid">
    <app-logo [routerLink]="'/home'"></app-logo>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <button class="btn btn-toolbar ms-4" [routerLink]="'/home'">
        Le mie classi
      </button>
    </div>

    <div class="dropdown ms-auto">
      <button
        class="btn p-0 border-0 lh-1 dropdown-toggle-no-caret me-3"
        type="button"
        (click)="toggleMenu()"
      >
        <app-avatar [picture]="user()?.picture" [size]="45" />
      </button>

      <ul
        class="dropdown-menu dropdown-menu-end end-0 shadow"
        [class.show]="isMenuOpen()"
      >
        <li>
          <span
            class="dropdown-item-text d-flex align-items-center fw-semibold"
          >
            {{ user()?.fullName }}
          </span>
          <span
            class="dropdown-item-text d-flex align-items-center gap-2 text-secondary small"
          >
            <i class="bi bi-person-square" aria-hidden="true"></i>
            <span>{{ getRole() }}</span>
          </span>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <button
            class="dropdown-item d-flex align-items-center gap-2 text-danger"
            (click)="logout(); closeMenu()"
          >
            <i class="bi bi-box-arrow-right"></i>
            <span>Logout</span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>
