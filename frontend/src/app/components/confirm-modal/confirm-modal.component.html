<div class="modal-header">
  <h5 class="modal-title">
    {{ title }}
  </h5>
  <button
    type="button"
    class="btn-close"
    aria-label="Chiudi"
    (click)="cancel()"
  ></button>
</div>

<div class="modal-body">
  <span>{{ message }}</span>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-primary" (click)="confirm()">
    {{ confirmLabel }}
  </button>
</div>
