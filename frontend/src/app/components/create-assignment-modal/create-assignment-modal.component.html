<div class="modal-header">
  <h5 class="modal-title">Nuova attività</h5>
  <button
    type="button"
    class="btn-close"
    aria-label="Chiudi"
    (click)="close()"
  ></button>
</div>

<div class="modal-body">
  <div class="mb-3">
    <label for="assignment-title" class="form-label">Titolo attività</label>
    <input
      #titleInput
      id="assignment-title"
      type="text"
      class="form-control"
      placeholder="Attività"
      [value]="title()"
      (input)="title.set(titleInput.value)"
      (keydown.enter)="confirmCreate()"
    />
  </div>

  @if (errorMessage()) {
    <div class="alert alert-danger mb-0" role="alert">
      {{ errorMessage() }}
    </div>
  }
</div>

<div class="modal-footer">
  <button
    type="button"
    class="btn btn-primary"
    [disabled]="!canSubmit()"
    (click)="confirmCreate()"
  >
    @if (isSaving()) {
      <span
        class="spinner-border spinner-border-sm me-2"
        aria-hidden="true"
      ></span>
    }
    Crea attività
  </button>
</div>
