@if (classrooms().length > 0) {
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    @for (classroom of classrooms(); track classroom.id) {
      <div class="col">
        <app-card-classroom [classroom]="classroom"></app-card-classroom>
      </div>
    }
  </div>
} @else {
  <div class="text-center py-5 my-4 bg-light rounded-3 border">
    <i class="bi bi-journal-x fs-1 text-secondary" aria-hidden="true"></i>
    <h2 class="h5 fw-bold text-secondary mt-2 mb-1">
      Nessuna classe disponibile
    </h2>
    <p class="text-body-secondary small mb-0">
      @if (isTeacher()) {
        Non hai ancora creato nessuna classe.
      } @else {
        Al momento non fai parte di nessuna classe.
      }
    </p>
  </div>
}
