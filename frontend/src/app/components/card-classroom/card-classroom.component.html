<div
  class="card h-100 border-0 shadow-sm classroom-card overflow-hidden"
  (click)="selected.emit()"
>
  <div class="card-header bg-primary border-0 text-white p-3">
    <h2
      class="h5 card-title mb-0 text-truncate fw-bold"
      [title]="classroom().name"
    >
      {{ classroom().name }}
    </h2>
  </div>

  <div class="card-body d-flex flex-column justify-content-between p-3">
    <div class="mb-3">
      <span class="text-uppercase text-muted fw-bold small d-block mb-1"
        >Docente</span
      >
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-person-circle text-secondary"></i>
        <span class="fw-medium text-truncate">{{
          classroom().createdBy.fullName
        }}</span>
      </div>
    </div>

    <div
      class="pt-2 border-top d-flex justify-content-between align-items-center text-muted small"
    >
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-people-fill text-primary"></i>
        <span class="fw-semibold">
          {{ classroom().studentsCount }}
          {{ classroom().studentsCount === 1 ? "studente" : "studenti" }}
        </span>
      </div>
      <span
        class="text-primary fw-medium d-inline-flex align-items-center gap-1"
      >
        Entra <i class="bi bi-arrow-right"></i>
      </span>
    </div>
  </div>
</div>
