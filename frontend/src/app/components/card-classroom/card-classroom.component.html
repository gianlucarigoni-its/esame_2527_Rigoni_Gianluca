<div class="card h-100 border-0 shadow-sm classroom-card overflow-hidden">
  <div class="card-header bg-primary border-0 text-white p-3">
    <h2
      class="h5 card-title mb-0 text-truncate fw-bold"
      [title]="classroom().name"
    >
      <a
        class="stretched-link text-white text-decoration-none"
        [routerLink]="['/classrooms', classroom().id]"
      >
        {{ classroom().name }}
      </a>
    </h2>
  </div>

  <div class="card-body d-flex flex-column justify-content-between p-3">
    <div class="mb-3">
      <span class="text-uppercase text-muted fw-bold small d-block mb-1"
        >Docente</span
      >
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-person-circle text-secondary" aria-hidden="true"></i>
        <span class="fw-medium text-truncate">{{
          classroom().createdBy.fullName
        }}</span>
      </div>
    </div>

    <div
      class="pt-2 border-top d-flex align-items-center gap-2 text-muted small"
    >
      <i class="bi bi-people-fill text-primary" aria-hidden="true"></i>
      <span class="fw-semibold">
        {{ classroom().studentsCount }}
        {{ classroom().studentsCount === 1 ? "studente" : "studenti" }}
      </span>
    </div>
  </div>
</div>
